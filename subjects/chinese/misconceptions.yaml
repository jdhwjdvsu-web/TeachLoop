misconceptions:
  只有观点没有证据: {strategy: 使用观点—证据—解释三列表格，要求每个判断都回到原文。}
  引用证据但未解释: {strategy: 增加“这说明……”句式支架，追问证据如何支持观点。}
  复述情节代替分析: {strategy: 区分“发生了什么”和“这表现了什么”，压缩复述、补充推理。}
  人物评价标签化: {strategy: 用具体、可被文本证明的特征替代好人、坏人等空泛标签。}
  概念未形成: {strategy: 先用短片段完成证据分类，再进入整篇阅读。}
  计算错误: {strategy: 按开放性回答量规复核文本证据与推理链。}

