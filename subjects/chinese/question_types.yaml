topics:
  记叙文阅读：人物形象分析:
    grades: [七年级, 八年级]
    objectives:
      - 能从人物语言、动作、心理和侧面描写中提取有效证据。
      - 能用“观点—证据—解释”结构概括人物形象。
      - 能区分文本证据与脱离文本的主观判断。
    classroom_questions:
      - 如果删去这处动作描写，你对人物的判断会发生什么变化？
      - 哪一处证据最能支持你的观点？为什么不是另一处？
    timeline:
      - {minutes: 5, stage: 诊断导入, activity: 比较两份匿名回答，判断哪份更有文本依据。}
      - {minutes: 8, stage: 证据定位, activity: 圈画人物描写并标注证据类型。}
      - {minutes: 10, stage: 结构示范, activity: 教师示范观点—证据—解释的完整链条。}
      - {minutes: 12, stage: 分层练习, activity: A/B/C 组分别完成证据选择、解释和综合评价。}
      - {minutes: 7, stage: 同伴互评, activity: 根据量规检查证据是否准确、解释是否充分。}
      - {minutes: 3, stage: 随堂测, activity: 独立完成一段人物形象分析。}
    practice_sets:
      A_基础巩固:
        - {question: 从给定片段中找出一处人物动作描写，并说明它表现了什么。, answer: 参考答案需包含准确引文和一个人物特点。, purpose: 建立证据与观点的对应}
        - {question: 判断“他很勇敢”属于观点还是文本证据，并说明理由。, answer: 属于观点；需要用具体描写作为证据。, purpose: 区分观点和证据}
      B_重点纠错:
        - {question: 用“人物特点＋文本证据＋解释”三部分改写一条空泛答案。, answer: 评分依据为结构完整、证据准确、解释能连接观点。, purpose: 纠正只有结论没有证据}
        - {question: 比较两处人物描写，选择更有力的一处支持“有责任感”。, answer: 开放答案；必须说明证据与责任感之间的联系。, purpose: 训练证据选择}
      C_拓展提升:
        - {question: 分析人物性格中看似矛盾的两个侧面，并分别提供证据。, answer: 开放答案；两个观点均需有文本证据且能解释矛盾的合理性。, purpose: 多角度人物评价}
        - {question: 评价环境描写如何间接塑造人物形象。, answer: 开放答案；需说明环境、人物反应和形象特征三者关系。, purpose: 侧面描写迁移}
    exit_ticket:
      question: 用80字左右概括人物形象，至少引用一处文本证据并解释其作用。
      answer: 按“观点明确、证据准确、解释充分、表达清楚”四项量规评分。
      checks: [是否有明确观点, 是否引用文本证据, 是否解释证据与观点的联系, 是否脱离文本]

