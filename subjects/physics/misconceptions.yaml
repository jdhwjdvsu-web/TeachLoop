misconceptions:
  速度公式混淆: {patterns: ["v=s*t", "v=t/s", 公式混淆], strategy: 使用数量关系三角图，并要求先写物理量含义再选公式。}
  单位换算错误: {patterns: [分钟未换算, 直接代入, 单位换算], strategy: 在代入公式前设置独立的单位统一步骤。}
  平均速度直接取平均: {patterns: [直接平均, 速度平均], strategy: 回到总路程除以总时间，用反例比较两种算法。}
  结果遗漏单位: {patterns: [无单位, 遗漏单位], strategy: 把单位作为答案完整性的必检项，并进行量纲检查。}
  实验变量控制不清: {patterns: [变量混乱, 未控制变量], strategy: 用自变量、因变量、控制变量表格梳理实验设计。}
  概念未形成: {strategy: 从运动快慢的真实比较情境建立比值意义。}
  计算错误: {strategy: 检查公式、单位、代入和数量级四个环节。}
default_blank_error: 概念未形成
default_error: 物理过程或计算错误
