topics:
  一元一次方程:
    grades: [七年级]
    objectives:
      - 能够依据等式性质解释移项与变号的原因。
      - 能够正确完成含括号或分母的一元一次方程。
      - 能够使用代入或逆运算检查解的正确性。
    classroom_questions:
      - 移项为什么必须变号？它对应等式两边进行了什么操作？
      - 哪一步最容易破坏等式两边的平衡？怎样检查？
    timeline:
      - {minutes: 5, stage: 诊断导入, activity: 展示匿名典型错例，学生判断第一处错误。}
      - {minutes: 10, stage: 概念重建, activity: 结合等式天平说明两边必须执行相同操作。}
      - {minutes: 10, stage: 错因纠正, activity: 针对最高频错因进行对比讲解和追问。}
      - {minutes: 12, stage: 分层练习, activity: A/B/C 三组完成不同支架和难度的练习。}
      - {minutes: 5, stage: 同伴解释, activity: 学生说明关键步骤及验算方法。}
      - {minutes: 3, stage: 随堂测, activity: 完成共同核心题，作为下一课调整依据。}
    practice_sets:
      A_基础巩固:
        - {question: "解方程：2*x + 3 = 7", answer: "x = 2", purpose: 巩固移项与等式性质}
        - {question: "解方程：3*x - 6 = 9", answer: "x = 5", purpose: 巩固合并和除法步骤}
      B_重点纠错:
        - {question: "解方程：4 - (x + 2) = 8", answer: "x = -6", purpose: 纠正括号外负号处理}
        - {question: "解方程：x/2 + 1 = 4", answer: "x = 6", purpose: 纠正去分母漏乘}
      C_拓展提升:
        - {question: "解方程：3*(2*x - 1) - 2*(x + 4) = 5", answer: "x = 4", purpose: 综合括号与合并同类项}
        - {question: "解方程：3*x - 5 = 16", answer: "x = 7", purpose: 建立实际问题中的方程模型}
    exit_ticket:
      question: "解方程并写出验算过程：5*x - 7 = 2*x + 8"
      answer: "x = 5"
      checks: [是否说明移项依据, 是否正确变号, 是否进行代入验算]
  一元一次不等式:
    grades: [八年级]
    objectives:
      - 能够依据不等式性质完成移项、合并和系数化为1。
      - 能够说明两边乘除负数时不等号方向改变的原因。
      - 能够写出解集，并在数轴上正确表示端点和方向。
    classroom_questions:
      - 为什么乘除负数会改变不等号方向？请用两个具体数说明。
      - 怎样用测试值检查解集方向和端点是否正确？
    timeline:
      - {minutes: 5, stage: 诊断导入, activity: 展示不等号方向和数轴端点的匿名典型错例。}
      - {minutes: 10, stage: 性质探究, activity: 用具体数值和数轴说明乘除负数时方向反转。}
      - {minutes: 10, stage: 错因纠正, activity: 对比严格与非严格不等式的端点表示。}
      - {minutes: 12, stage: 分层练习, activity: A/B/C 三组完成方向、端点和综合变式练习。}
      - {minutes: 5, stage: 测试值验证, activity: 选取区域内测试值代回原不等式。}
      - {minutes: 3, stage: 随堂测, activity: 求解不等式并提交数轴表示。}
    practice_sets:
      A_基础巩固:
        - {question: "解不等式：2*x + 3 < 9", answer: "x < 3", purpose: 巩固移项与系数化为1}
        - {question: "解不等式：5*x - 10 >= 0", answer: "x >= 2", purpose: 区分严格与非严格不等式}
      B_重点纠错:
        - {question: "解不等式：-2*x > 6", answer: "x < -3", purpose: 纠正除以负数未改变方向}
        - {question: "解不等式：4 - 3*x <= 10", answer: "x >= -2", purpose: 综合移项和负系数}
      C_拓展提升:
        - {question: "解不等式：3*(x - 2) > 2*x + 1", answer: "x > 7", purpose: 综合括号与两边含未知数}
        - {question: "解不等式：(2*x - 1)/3 <= x + 2", answer: "x >= -7", purpose: 综合分母与负系数}
    exit_ticket:
      question: "解不等式并在数轴上表示：-3*x + 2 > 11"
      answer: "x < -3"
      checks: [除以负数时是否改变方向, 端点是否为空心, 数轴方向是否向左]

