misconceptions:
  移项忘记变号: {patterns: ["=7+3", "=9+5", "=4+2", 移项符号不变], strategy: 用等式天平和左右两边同时操作进行对比，强调移项是等式性质的简写。}
  去括号符号错误: {patterns: ["-(x+2)=-x+2", "-(x-3)=-x-3", 去括号同号], strategy: 用颜色标记括号外符号，先逐项相乘，再合并同类项。}
  去分母漏乘: {patterns: [只乘一项, 漏乘], strategy: 圈出等式两边每一项，使用最小公倍数逐项核对。}
  等式两边操作不一致: {patterns: [只除左边, 两边操作不同], strategy: 用天平模型展示两边必须执行相同操作。}
  乘除负数未改变不等号方向: {patterns: [除以负数方向不变, 乘负数方向不变, "x>-3", "x>=-3"], strategy: 用数轴缩放和具体数值反例说明大小关系反转。}
  数轴端点开闭错误: {patterns: [严格不等式画实心, 非严格不等式画空心, 端点包含错误], strategy: 将严格与非严格不等式和空心、实心端点建立对应。}
  数轴方向错误: {patterns: [解集方向画反, 数轴方向向右, 数轴方向向左], strategy: 用测试值检查数轴表示是否包含正确区域。}
  概念未形成: {strategy: 先用具体数量关系建立概念，再进入符号运算。}
  计算错误: {strategy: 加入一步一检和逆运算验算。}
default_blank_error: 概念未形成
default_error: 计算错误
