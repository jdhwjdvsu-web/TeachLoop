misconceptions:
  移项忘记变号: {strategy: 用等式天平和左右两边同时操作进行对比，强调移项是等式性质的简写。}
  去括号符号错误: {strategy: 用颜色标记括号外符号，先逐项相乘，再合并同类项。}
  去分母漏乘: {strategy: 圈出等式两边每一项，使用最小公倍数逐项核对。}
  等式两边操作不一致: {strategy: 用天平模型展示两边必须执行相同操作。}
  乘除负数未改变不等号方向: {strategy: 用数轴缩放和具体数值反例说明大小关系反转。}
  数轴端点开闭错误: {strategy: 将严格与非严格不等式和空心、实心端点建立对应。}
  数轴方向错误: {strategy: 用测试值检查数轴表示是否包含正确区域。}
  概念未形成: {strategy: 先用具体数量关系建立概念，再进入符号运算。}
  计算错误: {strategy: 加入一步一检和逆运算验算。}

